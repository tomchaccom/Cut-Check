<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut & Check — 시스템 상태</title>
<link rel="stylesheet" href="sentence.css">
<style>
.d-page{max-width:900px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.d-sub{font-size:14px;color:var(--ink-2);margin-bottom:20px}

/* 상태 카드 */
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:24px}
.status-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.status-card .icon{font-size:28px;margin-bottom:6px}
.status-card .label{font-size:13px;color:var(--ink-3);font-weight:600}
.status-card .value{font-size:18px;font-weight:800;margin-top:2px}
.status-card.ok{border-color:var(--green)}.status-card.ok .value{color:var(--green)}
.status-card.err{border-color:var(--coral)}.status-card.err .value{color:var(--coral)}
.status-card.wait{border-color:var(--line)}.status-card.wait .value{color:var(--ink-3)}

/* 섹션 */
.d-section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.d-section h2{font-size:16px;font-weight:800;margin-bottom:4px}
.d-section .desc{font-size:13px;color:var(--ink-3);margin-bottom:14px}

/* 버튼 */
.d-btn{padding:10px 20px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.d-btn.primary{background:var(--green);color:#fff}
.d-btn.secondary{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink)}
.d-btn:disabled{opacity:.4;cursor:not-allowed}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* 테이블 */
.d-table{width:100%;border-collapse:collapse;font-size:13px}
.d-table th{text-align:left;padding:8px;border-bottom:2px solid var(--line);font-size:11px;color:var(--ink-3);font-weight:700}
.d-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge-ok{background:var(--green-soft);color:var(--green)}
.badge-err{background:var(--coral-soft);color:var(--coral)}
.badge-warn{background:var(--amber-soft);color:var(--amber)}
.badge-none{background:var(--surface-3);color:var(--ink-3)}

/* 로그 */
.d-log{font-family:var(--mono);font-size:12px;line-height:1.7;max-height:300px;overflow-y:auto;background:var(--surface-2);border-radius:10px;padding:14px;margin-top:10px}
.log-ok{color:var(--green)}.log-err{color:var(--coral)}.log-warn{color:var(--amber)}.log-info{color:var(--ink-2)}
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="auth-gate" style="max-width:360px;margin:120px auto;padding:0 20px;text-align:center">
  <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--green);color:#fff;font-family:var(--disp);font-weight:800;font-size:18px;margin-bottom:12px">C&C</div>
  <h2 style="font-size:18px;font-weight:800;margin-bottom:12px">관리자 접근</h2>
  <input type="password" id="gate-pw" placeholder="비밀번호" style="width:100%;padding:12px 16px;border:1px solid var(--line-strong);border-radius:10px;font-size:16px;text-align:center;min-height:48px;background:var(--surface);color:var(--ink)">
  <button id="gate-btn" style="width:100%;margin-top:10px;padding:12px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer;min-height:48px">확인</button>
  <p id="gate-msg" style="margin-top:10px;font-size:13px;color:var(--coral);min-height:20px"></p>
</div>

<div class="d-page" id="debug-content" hidden>

<h1>시스템 상태</h1>
<p class="d-sub">서비스가 제대로 동작하는지 한눈에 확인합니다. 로그인 후 사용하세요.</p>

<!-- 상태 요약 -->
<div class="status-grid">
  <div class="status-card wait" id="sc-conn"><div class="icon">🔌</div><div class="label">서버 연결</div><div class="value" id="sv-conn">확인 중</div></div>
  <div class="status-card wait" id="sc-auth"><div class="icon">👤</div><div class="label">로그인</div><div class="value" id="sv-auth">확인 중</div></div>
  <div class="status-card wait" id="sc-room"><div class="icon">🏫</div><div class="label">교실</div><div class="value" id="sv-room">확인 중</div></div>
  <div class="status-card wait" id="sc-mission"><div class="icon">📝</div><div class="label">미션</div><div class="value" id="sv-mission">확인 중</div></div>
  <div class="status-card wait" id="sc-event"><div class="icon">📊</div><div class="label">학생 활동</div><div class="value" id="sv-event">확인 중</div></div>
</div>

<!-- 학생 활동 -->
<div class="d-section">
  <h2>학생 활동 현황</h2>
  <p class="desc">교실에 등록된 학생과 미션 풀이 현황입니다.</p>
  <div id="students-area"></div>
</div>

<!-- 미션 목록 -->
<div class="d-section">
  <h2>등록된 미션</h2>
  <p class="desc">강사가 생성한 미션과 자료 구성입니다.</p>
  <div id="missions-area"></div>
</div>

<!-- AI 미션 테스트 -->
<div class="d-section">
  <h2>AI 미션 생성 테스트</h2>
  <p class="desc">"미션 생성" 버튼을 누르면 테스트 미션을 만들어봅니다. 실제로 저장되지 않습니다.</p>
  <div class="d-actions">
    <button class="d-btn primary" id="test-gen">미션 생성 테스트</button>
  </div>
  <div id="gen-area"></div>
</div>

<!-- 상세 로그 -->
<div class="d-section">
  <h2>상세 로그</h2>
  <p class="desc">각 검증 단계의 세부 결과입니다.</p>
  <div class="d-actions">
    <button class="d-btn secondary" onclick="runAll()">전체 다시 검증</button>
    <button class="d-btn secondary" onclick="document.getElementById('log').innerHTML=''">로그 지우기</button>
  </div>
  <div class="d-log" id="log"></div>
</div>

</div>

<script>
window.CC_SUPABASE = {
  url: 'https://btmhdsdabulgevgmrwyq.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0bWhkc2RhYnVsZ2V2Z21yd3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzUwNDIsImV4cCI6MjEwNjE1MTA0Mn0.mrDM6f9SXGA0YkWAkn5y0nC-nbdFsdyBwOQ1Fhk8FOY'
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/data/config.js"></script>
<script src="js/data/supabase.js"></script>
<script src="js/core/events.js"></script>
<script src="js/core/fold.js"></script>
<script src="js/core/onboard.js"></script>
<script src="js/core/hangul.js"></script>
<script src="js/core/pipeline.js"></script>
<script src="js/core/cards.js"></script>
<script>
(function(){
  var log=document.getElementById('log');
  var classroomId=null;
  function addLog(m,c){var d=document.createElement('div');d.className='log-'+(c||'info');d.textContent=new Date().toLocaleTimeString()+' '+m;log.appendChild(d);log.scrollTop=log.scrollHeight}
  function setCard(id,ok,val){var c=document.getElementById('sc-'+id);c.className='status-card '+(ok===true?'ok':ok===false?'err':'wait');document.getElementById('sv-'+id).textContent=val}
  function badge(ok,t){return '<span class="badge badge-'+(ok?'ok':ok===false?'err':'none')+'">'+t+'</span>'}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  async function checkAll(){
    addLog('검증 시작','info');

    // 1. 연결
    setCard('conn',CC.sb.active(),CC.sb.active()?'연결됨':'미연결');
    addLog('서버: '+(CC.sb.active()?'OK':'FAIL'),CC.sb.active()?'ok':'err');

    // 2. 인증
    var profile=await CC.sb.getProfile();
    setCard('auth',!!profile,profile?profile.name+' ('+profile.role+')':'로그인 필요');
    if(!profile){addLog('로그인 안 됨 — auth.html에서 로그인 후 새로고침','warn');return}
    addLog('사용자: '+profile.name+' ('+profile.role+')','ok');

    // 3. 교실
    var rooms=await CC.sb.myClassrooms();
    setCard('room',rooms.length>0,rooms.length?rooms[0].name+' ('+rooms[0].code+')':'없음');
    if(!rooms.length){addLog('교실 없음','warn');return}
    classroomId=rooms[0].id;
    addLog('교실: '+rooms[0].name,'ok');

    // 4. 미션
    var missions=await CC.sb.getMissions(classroomId);
    setCard('mission',missions.length>0,missions.length+'개');
    addLog('미션: '+missions.length+'개','ok');
    renderMissions(missions);

    // 5. 학생+이벤트
    var students=await CC.sb.getClassroomStudents(classroomId);
    var events=(await CC.sb.getClassroomEvents(classroomId))||[];
    setCard('event',events.length>0,students.length+'명 / 활동 '+events.length+'건');
    addLog('학생: '+students.length+'명, 이벤트: '+events.length+'건','ok');

    // fold
    if(events.length){
      var evs=events.map(function(r){var ev=r.event||{};ev.sid=r.student_id;ev.t=ev.t||new Date(r.created_at).getTime();return ev});
      var names={};events.forEach(function(r){if(r.profiles&&r.profiles.name)names[r.student_id]=r.profiles.name});
      var folded=CC.fold.foldMany(evs,{names:names,now:Date.now()});
      renderStudents(students,folded);
    } else {
      renderStudents(students,[]);
    }

    addLog('검증 완료','ok');
  }

  function renderStudents(enrolled,folded){
    var area=document.getElementById('students-area');
    if(!enrolled.length){area.innerHTML='<p style="color:var(--ink-3)">등록된 학생이 없습니다.</p>';return}

    var foldMap={};folded.forEach(function(s){foldMap[s.id]=s});

    var html='<table class="d-table"><tr><th>이름</th><th>성공 조건</th><th>방법</th><th>실행</th><th>판정</th><th>마무리</th></tr>';
    enrolled.forEach(function(st){
      var s=foldMap[st.id];
      if(s){
        html+='<tr><td><b>'+esc(st.name)+'</b></td>'+
          '<td>'+(s.sDefine?badge(true,esc(s.sDefine.choice)):badge(null,'미정'))+'</td>'+
          '<td>'+(s.sMethod?badge(true,esc(s.sMethod.cards?s.sMethod.cards.map(function(c){return c.label;}).join('→'):(s.sMethod.slots||{}).sep+'/'+(s.sMethod.slots||{}).dedup)):badge(null,'미정'))+'</td>'+
          '<td>'+badge(s.sRuns.length>0,s.sRuns.length+'건')+'</td>'+
          '<td>'+badge(s.sJudges.length>0,s.sJudges.length+'건')+'</td>'+
          '<td>'+(s.sWrap?badge(true,'완료'):badge(null,'미작성'))+'</td></tr>';
      } else {
        html+='<tr><td><b>'+esc(st.name)+'</b></td><td colspan="5">'+badge(null,'활동 없음')+'</td></tr>';
      }
    });
    html+='</table>';
    area.innerHTML=html;
  }

  function renderMissions(missions){
    var area=document.getElementById('missions-area');
    if(!missions.length){area.innerHTML='<p style="color:var(--ink-3)">생성된 미션이 없습니다.</p>';return}
    var html='<table class="d-table"><tr><th>제목</th><th>요청</th><th>자료</th><th>중복 검증</th></tr>';
    missions.forEach(function(m){
      var d=m.data||{};
      var v=d.verify||[];
      var last=v[v.length-1]||{};
      var dupOk=last.total!==last.unique;
      html+='<tr><td><b>'+esc(d.title||'-')+'</b></td>'+
        '<td style="font-size:12px;color:var(--ink-2)">'+esc(d.brief||'-')+'</td>'+
        '<td>'+((d.inputs||[]).length)+'개</td>'+
        '<td>'+(v.length?badge(dupOk,dupOk?'전체='+last.total+'/다른='+last.unique:'중복 없음'):badge(null,'검증표 없음'))+'</td></tr>';
    });
    html+='</table>';
    area.innerHTML=html;
  }

  // AI 테스트
  document.getElementById('test-gen').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;btn.textContent='생성 중...';
    var area=document.getElementById('gen-area');
    area.innerHTML='<p style="color:var(--ink-3)">미션을 만들고 있어요...</p>';
    try{
      /* 서버는 로그인한 강사만 받는다 — 토큰은 CC.sb.api 가 붙인다. 로그인 안 한 디버그 창은 401 로 돌아온다 */
      var data=await CC.sb.api('/api/generate-mission',{lesson:'테스트 수업',keyPoint:'데이터 흐름 확인'});
      var v=data.verify||[];var last=v[v.length-1]||{};
      area.innerHTML='<table class="d-table">'+
        '<tr><td><b>제목</b></td><td>'+esc(data.title)+'</td></tr>'+
        '<tr><td><b>요청</b></td><td>'+esc(data.brief)+'</td></tr>'+
        '<tr><td><b>동작 카드</b></td><td>'+CC.cards.forMission(data).map(function(c){return esc(c.label)}).join(', ')+'</td></tr>'+
        '<tr><td><b>자료</b></td><td>'+data.inputs.map(function(i){return esc(i.name)+': '+esc(i.v)}).join('<br>')+'</td></tr>'+
        '<tr><td><b>중복 검증</b></td><td>'+badge(last.total!==last.unique,(last.total!==last.unique?'OK':'FAIL')+' (전체='+last.total+'/다른='+last.unique+')')+'</td></tr>'+
        '</table>';
      addLog('미션 생성 성공: '+data.title,'ok');
    }catch(e){
      area.innerHTML='<p style="color:var(--coral)">'+esc(e.message)+'</p>';
      addLog('미션 생성 실패: '+e.message,'err');
    }
    btn.disabled=false;btn.textContent='미션 생성 테스트';
  });

  window.runAll=function(){log.innerHTML='';checkAll()};

  /* 비밀번호 확인 후 실행 */
  var PASS='cutcheck2026';
  var gate=document.getElementById('auth-gate');
  var content=document.getElementById('debug-content');
  if(sessionStorage.getItem('debug-auth')==='ok'){gate.hidden=true;content.hidden=false;checkAll()}
  document.getElementById('gate-btn').addEventListener('click',function(){
    if(document.getElementById('gate-pw').value===PASS){
      sessionStorage.setItem('debug-auth','ok');gate.hidden=true;content.hidden=false;checkAll();
    } else {document.getElementById('gate-msg').textContent='비밀번호가 맞지 않습니다.';}
  });
  document.getElementById('gate-pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('gate-btn').click()});
})();
</script>
</body>
</html>

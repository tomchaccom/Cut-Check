  </header>

  <nav class="side" id="side" aria-label="메뉴">
    <div class="side-top">
      <span class="brand"><img class="mark" src="favicon.svg" alt=""><b class="lbl">KOMPAS</b></span>
      <button type="button" class="iconbtn" id="side-toggle" aria-controls="side" aria-expanded="true" aria-label="메뉴 접기"><span aria-hidden="true">‹</span></button>
    </div>
    <div class="side-bottom">
      <a class="navl" href="teacher.html" title="선생님 화면"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lbl">선생님 화면</span></a>
      <button type="button" class="navl" id="ad-logout" title="로그아웃" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl">로그아웃</span></button>
    </div>
  </nav>
  <div class="side-scrim" id="side-scrim" hidden></div>

  <main class="shell-main ad" id="main">
    <div class="t-head"><h1 class="big-title">관리자 화면</h1></div>
    <p class="lead" id="ad-note" role="status">불러오는 중이에요.</p>

    <!-- 서버가 관리자라고 답할 때만 채운다. 강사는 서버가 준 순서(이름순) 그대로 — 쓴 횟수로 줄 세우지 않는다 -->
    <div id="ad-main" hidden>
      <section class="panel">
        <div class="hd"><div><h2>강사별 생성 한도</h2><p class="lead">미션 1개 만들기 = 1개. 한도를 바꾸면 바로 저장돼요.</p></div></div>
        <label class="ad-default">새 강사 기본 한도 <input type="number" id="ad-default" class="ad-in" min="0" max="1000" step="1"> <span class="ad-msg" id="ad-default-msg" role="status"></span></label>
        <table class="ad-table" id="ad-teachers">
          <thead><tr><th>이름</th><th>이메일</th><th>쓴</th><th>남은</th><th>한도</th><th>생성 끄기</th><th>상태</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <section class="panel">
        <div class="hd"><div><h2>최근 생성 기록</h2><p class="lead">성공한 생성만 남아요. 최근 50건.</p></div></div>
        <p class="lead" id="ad-log-empty" hidden>아직 만든 미션이 없어요.</p>
        <table class="ad-table" id="ad-log">
          <thead><tr><th>시각</th><th>강사</th><th>수업 내용</th><th>개념</th><th>종류</th><th>재요청</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>

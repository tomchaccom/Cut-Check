<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut &amp; Check · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sentence.css">
<style>
.auth-page { max-width: 420px; margin: 60px auto; padding: 0 18px; }
.auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
.auth-card .sub { text-align: center; color: var(--ink-2); font-size: 14px; margin-bottom: 24px; }
.auth-tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-strong); }
.auth-tab { flex: 1; padding: 10px; text-align: center; font-weight: 600; font-size: 14px; background: var(--surface-2); color: var(--ink-3); border: none; cursor: pointer; transition: background .12s, color .12s; }
.auth-tab.active { background: var(--green); color: var(--paper); }
.field { display: block; margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.field input, .field select { display: block; width: 100%; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px; background: var(--surface); color: var(--ink); min-height: 44px; }
.field input::placeholder { color: var(--ink-3); }
.auth-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--green); color: var(--paper); font-weight: 700; font-size: 16px; cursor: pointer; min-height: 48px; transition: opacity .12s; }
.auth-btn:disabled { opacity: .4; cursor: not-allowed; }
.auth-btn:hover:not(:disabled) { opacity: .85; }
.auth-msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 20px; }
.auth-msg.error { color: var(--coral); }
.auth-msg.ok { color: var(--green); }
.divider { text-align: center; color: var(--ink-3); font-size: 13px; margin: 20px 0; position: relative; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: var(--line); }
.divider::before { left: 0; } .divider::after { right: 0; }
.join-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.join-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.hint { font-size: 13px; color: var(--ink-2); margin: -4px 0 16px; }
.logo-center { text-align: center; margin-bottom: 20px; }
.logo-center .mark { width: 48px; height: 48px; border-radius: 14px; background: var(--green); color: var(--paper); display: inline-grid; place-items: center; font-family: var(--disp); font-weight: 800; font-size: 20px; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="logo-center"><span class="mark">C&amp;C</span></div>

  <div class="auth-card">
    <h1>Cut &amp; Check</h1>
    <p class="sub">자르고, 세 번 확인한다</p>

    <!-- 탭 -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">로그인</button>
      <button class="auth-tab" id="tab-signup">강사 가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="form-login">
      <div class="field"><label for="login-email">이메일 또는 아이디</label><input type="text" id="login-email" placeholder="선생님은 이메일, 학생은 받은 아이디" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="login-pw">비밀번호</label><input type="password" id="login-pw" placeholder="6자 이상" autocomplete="current-password" required minlength="6"></div>
      <button class="auth-btn" type="submit">로그인</button>
    </form>

    <!-- 회원가입 폼 -->
    <form id="form-signup" hidden>
      <div class="field"><label>이름</label><input type="text" id="signup-name" placeholder="이름" required></div>
      <div class="field"><label>이메일</label><input type="email" id="signup-email" placeholder="email@example.com" required></div>
      <div class="field"><label>비밀번호</label><input type="password" id="signup-pw" placeholder="6자 이상" required minlength="6"></div>
      <p class="hint">학생 계정은 선생님이 교실에서 만들어 줘요.</p>
      <button class="auth-btn" type="submit">강사로 가입하기</button>
    </form>

    <div class="auth-msg" id="auth-msg"></div>

    <!-- 강사: 교실 만들기 -->
    <div class="join-section" id="create-section" hidden>
      <h3>교실 만들기</h3>
      <div class="field"><label>교실 이름</label><input type="text" id="create-name" placeholder="예: 2학년 3반"></div>
      <button class="auth-btn" id="create-btn" style="background:var(--green)">교실 만들기</button>
      <div id="create-result" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
window.CC_SUPABASE = {
  url: 'https://btmhdsdabulgevgmrwyq.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0bWhkc2RhYnVsZ2V2Z21yd3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzUwNDIsImV4cCI6MjEwNjE1MTA0Mn0.mrDM6f9SXGA0YkWAkn5y0nC-nbdFsdyBwOQ1Fhk8FOY'
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/data/config.js"></script>
<script src="js/data/supabase.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#auth-msg');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'auth-msg ' + (type || '');
  }

  /* 탭 전환 */
  $('#tab-login').addEventListener('click', function () {
    this.classList.add('active'); $('#tab-signup').classList.remove('active');
    $('#form-login').hidden = false; $('#form-signup').hidden = true;
    showMsg('');
  });
  $('#tab-signup').addEventListener('click', function () {
    this.classList.add('active'); $('#tab-login').classList.remove('active');
    $('#form-signup').hidden = false; $('#form-login').hidden = true;
    showMsg('');
  });

  /* Supabase 미설정 안내 */
  if (!CC.sb.active()) {
    showMsg('Supabase가 설정되지 않았어요. CC_SUPABASE 설정을 확인하세요.', 'error');
  }

  /* 이미 로그인 상태면 리다이렉트 */
  CC.sb.getProfile().then(function (p) {
    if (p) redirectByRole(p);
  });

  function redirectByRole(profile) {
    /* 폼 숨기기 */
    $('#form-login').hidden = true;
    $('#form-signup').hidden = true;
    document.querySelector('.auth-tabs').hidden = true;

    if (profile.role === 'teacher') {
      /* 강사: 교실이 있으면 바로 이동, 없으면 만들기 표시 */
      CC.sb.myClassrooms().then(function (rooms) {
        if (rooms.length) {
          showMsg(profile.name + ' 선생님, 교실이 있어요. 이동합니다...', 'ok');
          setTimeout(function () { window.location.href = 'teacher.html'; }, 800);
        } else {
          $('#create-section').hidden = false;
          showMsg(profile.name + ' 선생님 환영합니다. 교실을 만들어주세요.', 'ok');
        }
      });
    } else {
      /* 학생: 교실에 등록되어 있으면 바로 미션으로 */
      CC.sb.myClassrooms().then(function (rooms) {
        if (rooms.length) {
          showMsg(profile.name + '님, 교실에 입장합니다...', 'ok');
          setTimeout(function () { window.location.href = 'sentence.html'; }, 800);
        } else {
          showMsg(profile.name + '님은 아직 교실에 없어요. 선생님께 교실에 넣어 달라고 말해 주세요.', 'ok');
        }
      });
    }
  }

  function friendlyError(msg) {
    if (/Invalid login/i.test(msg)) return '이메일(아이디) 또는 비밀번호가 맞지 않아요.';
    if (/already registered/i.test(msg)) return '이미 가입된 이메일이에요.';
    if (/Email not confirmed/i.test(msg)) return '이메일 인증이 필요해요.';
    if (/Password.*short/i.test(msg)) return '비밀번호는 6자 이상이어야 해요.';
    if (/rate limit/i.test(msg)) return '잠시 후 다시 시도해주세요.';
    return msg;
  }

  /* 로그인 */
  $('#form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    /* 버튼 클릭·Enter 만 로그인이다. 자동완성·스크립트가 낸 submit(submitter 없음)은 무시한다 */
    if (e.submitter === null) return;   /* undefined = submitter 미지원 브라우저(iPad Safari < 15.4) → 허용 */
    showMsg('로그인 중...', '');
    CC.sb.signIn($('#login-email').value, $('#login-pw').value)
      .then(function () { return CC.sb.getProfile(); })
      .then(function (p) {
        if (!p) { showMsg('프로필을 찾을 수 없어요.', 'error'); return; }
        redirectByRole(p);
      })
      .catch(function (err) { showMsg(friendlyError(err.message), 'error'); });
  });

  /* 회원가입 */
  $('#form-signup').addEventListener('submit', function (e) {
    e.preventDefault();
    showMsg('가입 중...', '');
    CC.sb.signUp(
      $('#signup-email').value,
      $('#signup-pw').value,
      $('#signup-name').value
    ).then(function () {
      showMsg('가입 완료! 자동으로 로그인합니다...', 'ok');
      return CC.sb.signIn($('#signup-email').value, $('#signup-pw').value);
    }).then(function () {
      return CC.sb.getProfile();
    }).then(function (p) {
      if (p) {
        showMsg(p.name + '님 환영합니다!', 'ok');
        setTimeout(function () { redirectByRole(p); }, 800);
      } else {
        showMsg('가입 완료! 로그인해주세요.', 'ok');
        $('#tab-login').click();
      }
    }).catch(function (err) { showMsg(err.message, 'error'); });
  });

  /* 강사: 교실 만들기 */
  $('#create-btn').addEventListener('click', function () {
    var name = $('#create-name').value.trim();
    if (!name) { showMsg('교실 이름을 입력해주세요.', 'error'); return; }
    showMsg('교실 만드는 중...', '');
    CC.sb.createClassroom(name)
      .then(function (room) {
        var res = $('#create-result');
        res.innerHTML = '<div style="background:var(--green-soft);border:1px solid var(--green);border-radius:10px;padding:14px;margin-top:8px">' +
          '<b>' + room.name + '</b> 교실이 만들어졌어요!<br>' +
          '<span style="font-size:13px;color:var(--ink-2)">선생님 화면의 학생 추가에서 학생 계정을 만들어 주세요.</span>' +
          '</div>';
        showMsg('', '');
        /* 2초 후 이동 버튼 표시 */
        var goBtn = document.createElement('button');
        goBtn.className = 'auth-btn';
        goBtn.textContent = '선생님 화면으로 이동';
        goBtn.style.marginTop = '12px';
        goBtn.addEventListener('click', function () { window.location.href = 'teacher.html'; });
        res.appendChild(goBtn);
      })
      .catch(function (err) { showMsg(err.message, 'error'); });
  });

})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>강사 대시보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#555555}
.tabn{font-size:14px;padding:10px 0;color:#555555;text-decoration:none;border-bottom:2px solid transparent}
.tabn.on{color:#111111;font-weight:600;border-bottom-color:#111111}
.folder{position:relative;width:100%;aspect-ratio:1.18/1}
.folder .tab{position:absolute;left:0;top:0;width:42%;height:22%;border-radius:10px 16px 0 0;background:#E9DB2B}
.folder .body{position:absolute;left:0;right:0;bottom:0;top:9%;border-radius:10px;background:#FFF23D;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 18px rgba(0,0,0,.06)}
.folder.idle .tab{background:#D6D6D6}.folder.idle .body{background:#F0F0F0}
.folder .dot{position:absolute;right:10px;bottom:10px;width:12px;height:12px;border-radius:50%;background:#111111}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;text-decoration:none;color:#111111}
.tile:hover{background:#F6F6F6}
.tile:focus-visible{outline:2px solid #111111;outline-offset:2px}
.mo{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid #E3E3E3;font-size:15px;line-height:1.5}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#111111;background:#FFFFFF;min-height:1000px;box-sizing:border-box;padding:32px clamp(16px,4vw,56px) 64px">
<div style="max-width:1280px;margin:0 auto">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;min-height:44px">
<nav aria-label="위치" style="display:flex;gap:8px;align-items:center;font-size:15px"><a href="#" style="text-decoration:none">내 교실</a><span aria-hidden="true" style="color:#888888">/</span><span>1학년 3반</span><span style="margin-left:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid #111111">강사</span></nav>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span style="font-size:14px;color:#555555">교실 코드 <b style="font-family:'Archivo',sans-serif;font-size:18px;color:#111111;letter-spacing:.06em">3K7Q</b></span>
<a href="NewMission.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#111111;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600">미션 만들기</a>
</div>
</div>
<h1 style="margin:8px 0 0;font-weight:500;font-size:clamp(56px,11vw,150px);line-height:.95;letter-spacing:-0.04em">1학년 3반</h1>
<nav aria-label="보기" style="display:flex;flex-wrap:wrap;gap:28px;border-bottom:1px solid #111111;margin-top:18px">
<a class="tabn on" href="#" aria-current="page">학생</a><a class="tabn" href="#">미션</a><a class="tabn" href="#">질문 기록</a>
</nav>
<div style="display:flex;flex-wrap:wrap;gap:56px;margin-top:32px">
<section aria-label="학생" style="flex:999 1 600px;min-width:0">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:18px">
<h2 style="margin:0;font-size:15px;font-weight:600">학생 — 가나다순</h2>
<p style="margin:0;font-size:13px;color:#555555;display:flex;gap:14px;align-items:center"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#111111"></span>새 순간이 있어요</span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:10px;border-radius:3px;background:#F0F0F0;border:1px solid #D6D6D6"></span>오늘 아직 안 들어왔어요</span></p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:24px 18px">
<sc-for list="{{students}}" as="s" hint-placeholder-count="8">
<a class="tile" href="TeacherStudent.dc.html">
<span class="folder {{s.kind}}" aria-hidden="true"><span class="tab"></span><span class="body"></span><sc-if value="{{s.fresh}}" hint-placeholder-val="{{false}}"><span class="dot"></span></sc-if></span>
<span style="font-size:15px;font-weight:600">{{s.name}}</span>
<span style="font-size:13px;color:#555555;text-align:center;line-height:1.35">{{s.where}}</span>
</a>
</sc-for>
</div>
</section>
<section aria-label="말 걸 순간" style="flex:1 1 320px;min-width:0">
<h2 style="margin:0 0 6px;font-size:15px;font-weight:600">말 걸 순간</h2>
<p style="margin:0 0 10px;font-size:13px;color:#555555">점수가 아니라 타이밍이에요. 격려의 말은 선생님이 해 주세요.</p>
<ul style="list-style:none;margin:0;padding:0;border-top:1px solid #111111">
<sc-for list="{{moments}}" as="m" hint-placeholder-count="5">
<li class="mo"><span style="font-size:13px;color:#555555">{{m.t}}</span><span><a href="TeacherStudent.dc.html" style="font-weight:600;text-decoration:none">{{m.who}}</a><span style="color:#888888"> · </span>{{m.what}}</span></li>
</sc-for>
</ul>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>

renderVals() {
return {
students: [
{ name: '김하은', where: '급식 재료 · 코딩', kind: '', fresh: false },
{ name: '박지호', where: '급식 재료 · 설계', kind: '', fresh: true },
{ name: '서민서', where: '급식 재료 · 코딩', kind: '', fresh: true },
{ name: '오태인', where: '급식 재료 · 정리까지 했어요', kind: '', fresh: true },
{ name: '이도윤', where: '출석 확인 · 성공 조건', kind: '', fresh: false },
{ name: '정서연', where: '아직 안 들어왔어요', kind: 'idle', fresh: false },
{ name: '최지우', where: '급식 재료 · 코딩', kind: '', fresh: false },
{ name: '한유준', where: '아직 안 들어왔어요', kind: 'idle', fresh: false }
],
moments: [
{ t: '방금', who: '오태인', what: '정리를 남겼어요 — "겹치는 걸 빼야 한다는 걸 수요일 자료를 보고 알았다."' },
{ t: '2분 전', who: '서민서', what: '새로 온 자료로 돌려 보고 "지키지 못했다" 고 스스로 판단했어요' },
{ t: '4분 전', who: '박지호', what: '설계도를 냈어요 (나누기 → 개수 세기)' },
{ t: '6분 전', who: '서민서', what: '성공 조건을 다시 정했어요' },
{ t: '9분 전', who: '최지우', what: '튜터에게 "set은 언제 써요?" 를 물었어요' }
]
};
}
}
</script>
</body>
</html>

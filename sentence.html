<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut &amp; Check · 문장형 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sentence.css">
</head>
<body>

<div class="page">
  <!-- 상단 바 -->
  <header class="topbar">
    <div class="brand">
      <span class="mark">C&amp;C</span>
      <div>
        <b>Cut &amp; Check</b>
        <small id="save-status">저장됨</small>
      </div>
    </div>
    <nav class="steps-nav" id="steps-nav">
      <span data-step="1">요청</span>
      <span data-step="2">성공</span>
      <span data-step="3">방법</span>
      <span data-step="4">확인</span>
      <span data-step="5">마무리</span>
    </nav>
    <div class="toptools">
      <span class="tbtn" id="user-info" style="cursor:default" hidden></span>
      <button class="tbtn" id="gen-mission-btn" hidden>미션 생성</button>
      <a class="tbtn" href="teacher.html">선생님 화면</a>
      <button class="tbtn" id="logout-btn" hidden>로그아웃</button>
      <a class="tbtn" href="auth.html" id="login-link">로그인</a>
    </div>
  </header>

  <nav class="mission-bar" id="mission-bar"></nav>

  <main class="content">

    <!-- 화면 1: 요청 읽기 -->
    <section class="step active" id="step1" tabindex="-1">
      <h2 class="step-title">요청을 읽어보세요</h2>
      <div class="request-card">
        <span class="req-from">창고 관리팀 · 업무 요청</span>
        <p class="req-text" id="brief"></p>
      </div>
      <div class="sample-box">
        <span class="sample-label" id="sample-label">첫 번째 주문서</span>
        <code class="sample-data" id="sample-data"></code>
      </div>
      <div class="step-action">
        <button class="btn primary" id="go-define">성공 조건 정하기</button>
      </div>
    </section>

    <!-- 화면 2: 성공 정하기 -->
    <section class="step" id="step2" tabindex="-1">
      <h2 class="step-title">성공을 정해보세요</h2>
      <p class="sentence-frame">나는 주문서에서
        <span class="slot-wrap">
          <select class="slot" id="slot-define" aria-label="성공 조건">
            <option value="">선택하기</option>
          </select>
        </span>
        가 나오면 성공이라고 생각한다.
      </p>
      <label class="reason-label">이유
        <textarea class="reason" id="reason-define" placeholder="요청을 이렇게 이해한 이유를 적어보세요. '아직 설명하기 어렵다'도 괜찮아요." rows="2"></textarea>
      </label>
      <div class="step-actions">
        <button class="btn secondary" id="back-request">요청 다시 보기</button>
        <button class="btn primary" id="go-method" disabled>방법 쓰기</button>
      </div>
    </section>

    <!-- 화면 3: 방법 쓰기 -->
    <section class="step" id="step3" tabindex="-1">
      <h2 class="step-title">처리 방법을 정해보세요</h2>
      <div class="method-sentences">
        <p class="sentence-frame" id="sent1">
          <span class="sent-num">1</span>
          주문서를
          <span class="slot-wrap">
            <select class="slot" id="slot-sep" aria-label="나누는 기준">
              <option value="">선택하기</option>
            </select>
          </span>
          기준으로 나눈다.
        </p>
        <p class="sentence-frame" id="sent2">
          <span class="sent-num">2</span>
          같은 이름은
          <span class="slot-wrap">
            <select class="slot" id="slot-dedup" aria-label="중복 처리">
              <option value="">선택하기</option>
            </select>
          </span>.
        </p>
        <p class="sentence-frame" id="sent3">
          <span class="sent-num">3</span>
          <span class="slot-wrap">
            <select class="slot" id="slot-output" aria-label="출력 값">
              <option value="">선택하기</option>
            </select>
          </span>을 출력한다.
        </p>
      </div>
      <div class="method-summary" id="method-summary" hidden>
        <span class="summary-label">현재 방법 요약</span>
        <p id="summary-text"></p>
      </div>
      <label class="reason-label">이유
        <textarea class="reason" id="reason-method" placeholder="이 방법을 고른 이유를 적어보세요." rows="2"></textarea>
      </label>
      <div class="step-actions">
        <button class="btn secondary" id="back-define">성공 조건 수정</button>
        <button class="btn primary" id="go-run" disabled>자료로 확인하기</button>
      </div>
    </section>

    <!-- 화면 4: 자료별 예상·실행·판정 -->
    <section class="step" id="step4" tabindex="-1">
      <h2 class="step-title">자료로 확인해보세요</h2>
      <div class="current-config" id="current-config">
        <div class="config-item">
          <span class="config-label">성공 조건</span>
          <span class="config-value" id="cfg-define"></span>
        </div>
        <div class="config-item">
          <span class="config-label">방법</span>
          <span class="config-value" id="cfg-method"></span>
        </div>
      </div>

      <div class="data-runner" id="data-runner">
        <!-- 자료 카드가 JS에서 하나씩 생성됨 -->
      </div>

      <div class="past-runs" id="past-runs" hidden>
        <button class="btn text" id="toggle-past">지난 실행 보기</button>
        <div id="past-runs-list" hidden></div>
      </div>

      <div class="step-actions">
        <button class="btn secondary" id="back-method">방법 수정</button>
        <button class="btn secondary" id="back-define2">성공 조건 수정</button>
        <button class="btn text" id="help-btn">도움 요청</button>
        <button class="btn primary" id="go-wrap" disabled>마무리로</button>
      </div>
    </section>

    <!-- 화면 5: 마무리 -->
    <section class="step" id="step5" tabindex="-1">
      <h2 class="step-title">오늘을 마무리해보세요</h2>
      <div class="wrap-history" id="wrap-history">
        <!-- JS에서 처음 선택·최근 선택·실행 기록 요약 -->
      </div>
      <div class="wrap-prompts">
        <label class="wrap-line">처음에는 <textarea class="reason inline" id="wrap1" rows="1" placeholder="___"></textarea>라고 생각했다.</label>
        <label class="wrap-line">자료 <textarea class="reason inline" id="wrap2" rows="1" placeholder="___"></textarea>에서 <textarea class="reason inline" id="wrap3" rows="1" placeholder="___"></textarea>를 보았다.</label>
        <label class="wrap-line">그래서 <textarea class="reason inline" id="wrap4" rows="1" placeholder="___를 바꿨다 / 유지했다"></textarea>.</label>
        <label class="wrap-line">아직 확인하지 못한 것은 <textarea class="reason inline" id="wrap5" rows="1" placeholder="___"></textarea>다.</label>
      </div>
      <div class="step-actions">
        <button class="btn primary" id="finish" disabled>수업 기록 마무리</button>
      </div>
      <div id="wrap-done" hidden>
        <p class="done-msg">기록이 저장되었어요. 세 자료를 확인했습니다.</p>
      </div>
    </section>

  </main>
</div>

<!-- 도움 요청 모달 -->
<dialog id="help-dialog">
  <form method="dialog" class="help-form">
    <h3>도움을 요청해보세요</h3>
    <label class="help-field">
      기대한 결과
      <input type="text" id="help-expected" placeholder="기대한 결과를 적거나 '아직 모르겠어요'">
    </label>
    <label class="help-field">
      막힌 부분
      <select id="help-stuck">
        <option value="">선택하기</option>
        <option value="도구 사용">도구 사용</option>
        <option value="결과 해석">결과 해석</option>
        <option value="기준 정하기">기준 정하기</option>
        <option value="직접 입력">직접 입력</option>
      </select>
    </label>
    <div class="help-actions">
      <button class="btn secondary" value="cancel">닫기</button>
      <button class="btn primary" id="help-send" value="send">보내기</button>
    </div>
  </form>
</dialog>
